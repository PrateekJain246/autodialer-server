name: Build Call Blocker APK

# Builds the Android Call Blocker app on GitHub's runners (which have the
# Android SDK + internet access) and publishes the installable debug APK as a
# downloadable artifact and a GitHub Release.

on:
  push:
    branches:
      - "claude/android-call-blocker-140-3h5cwx"
    paths:
      - "android-call-blocker/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-call-blocker
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-call-blocker/app/build/outputs/apk/debug/app-debug.apk \
             dist/call-blocker-140.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-blocker-140-apk
          path: dist/call-blocker-140.apk
          if-no-files-found: error

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callblocker-v1.0
          name: Call Blocker 140 (debug build)
          body: |
            Installable debug APK that blocks incoming calls starting with 140.

            **Install:** download `call-blocker-140.apk`, copy it to your Android
            phone, tap it, and allow "install from unknown sources". After
            installing, open the app and tap "Set as call-screening app".
          files: dist/call-blocker-140.apk
          fail_on_unmatched_files: true
